# Target profile, scoring weights, sources and email.
# Every value here is read on each run; edit, commit, and the next run picks it up.

candidate:
  timezone: America/New_York # used for "posted N days ago" and the Monday digest

# Keyword lists. These are the defaults; the dashboard's Keywords page can override any list
# (stored in the database), and "reset" there falls back to what's written here.
# All matching is whole-word and case-insensitive; "L&D", "Sr." and "&" are normalized.
keywords:
  # Sent as search queries to company job boards (Workday, Oracle, Eightfold, KPMG).
  search_terms:
    - learning development
    - training
    - talent development
    - leadership development
    - organizational development
    - instructional design
    - university relations
    - early careers
    - campus recruiting
    - internship program
    - onboarding
  # A title with one of these plus a seniority word counts as L&D on its own.
  strong_titles:
    - learning
    - learning and development
    - talent development
    - leadership development
    - people development
    - organizational development
    - instructional design
    - curriculum
    - talent management
    - talent experience
    - training
    - coaching
    - upskilling
    - employee development
  # Softer title words: they count only when the description also has an L&D term.
  soft_titles:
    - organizational effectiveness
    - instructional
    - education
    - academy
    - university
    - workforce capability
    - people capability
    - reskilling
    - people programs
    - employee experience
    - onboarding
    - facilitation
    - knowledge management
  # Early-talent program titles (the corporate counterpart of a co-op director). Matched as whole phrases.
  early_talent_titles:
    - university relations
    - university recruiting
    - university programs
    - university talent
    - campus recruiting
    - campus relations
    - campus programs
    - early career
    - early careers
    - early talent
    - emerging talent
    - internship program
    - internship programs
    - intern program
    - intern programs
    - co-op program
    - co-op programs
    - student programs
    - graduate program
    - graduate programs
    - new hire experience
    - new employee experience
    - employee onboarding
    - onboarding experience
    - onboarding programs
    - rotational program
    - rotational programs
  # A title needs one of these to count (manager level and up).
  seniority:
    - manager
    - senior manager
    - director
    - associate director
    - senior director
    - head
    - lead
    - leader
    - principal
    - business partner
  # Description phrases that only show up in genuine L&D work. A soft title needs 1; an odd title needs 5.
  description_terms:
    - LMS
    - learning management system
    - instructional design
    - ADDIE
    - Kirkpatrick
    - needs analysis
    - needs assessment
    - learning strategy
    - learning programs
    - leadership development
    - facilitat
    - curriculum
    - e-learning
    - elearning
    - Articulate
    - Storyline
    - Rise 360
    - Cornerstone
    - Workday Learning
    - Degreed
    - Docebo
    - 360Learning
    - onboarding program
    - competency
    - upskill
    - reskill
    - talent development
    - learning experience
    - 70-20-10
    - train the trainer
    - manager development
    - learning and development
    - learning culture
    - career development
    - succession
    - coaching program
    - learning technology
  # Any of these in a title rejects it. A word inside a matched early-talent phrase is ignored,
  # so "Internship Program Manager" survives the "intern" rule.
  exclude_titles:
    # Wrong level
    - coordinator
    - specialist
    - instructional designer i
    - instructional designer ii
    - vp
    - vice president
    - chief learning officer
    - intern
    - internship
    - trainee
    - in training
    - student
    # "Learning"/"training" that means something else
    - machine learning
    - deep learning
    - post training
    - pre training
    - model training
    - training runtime
    - inference
    - engineer
    - engineering
    - developer
    - ml
    - ai
    - scientist
    - research
    - data
    - infrastructure
    # Sales / customer / partner enablement: trains revenue teams, not employees broadly
    - sales enablement
    - gtm enablement
    - customer enablement
    - field enablement
    - partner enablement
    - revenue enablement
    - technical enablement
    - product enablement
    - customer education
    - customer success
    - customer
    - support
    - sales
    - gtm
    - go to market
    - revenue
    - field
    - partnerships
    - commercial
    - account executive
    - account manager
    - solutions
    # Recruiting individual contributors (early-talent program phrases are exempt)
    - recruiter
    - recruiting
    - sourcing
    # Other jobs that borrow L&D words
    - product manager
    - product designer
    - marketing
    - content
    - generalist
    - quality
    - store
    - assistant store manager
    # Clinical and patient education
    - physician
    - nurse
    - nursing
    - clinical
    - clinical education
    - patient
    - medical
    - pediatric
    - surgery
    - surgical
    - vascular
    - endovascular
    - gi
    - teacher
    - tutor
    - professor

profile:
  # Queries for the keyword-search aggregators (Adzuna, JSearch, Google Jobs), and full title-score
  # credit when every word of one appears in a title (any order). Other passing titles get half.
  title_keywords:
    - Learning & Development Manager
    - Sr. Manager L&D
    - Director of Learning
    - Head of L&D
    - Talent Development Manager
    - Learning Experience Manager
    - University Relations Manager
    - Early Careers Program Manager
    - Campus Recruiting Manager
    - Internship Program Manager
  salary:
    target: 150000
    sweet_min: 140000 # full points if the range overlaps sweet_min..sweet_max
    sweet_max: 165000
    min: 130000 # partial points if it overlaps min..max
    max: 175000
    floor: 120000 # 0 points if the posted max is below this
  locations:
    remote_us: true
    # Hybrid/on-site roles only pass in these places. "City, ST" matches that city in that
    # state only (Manchester NH, not Manchester UK); an entry without a state is a plain substring.
    metros:
      # Metro Boston
      - Boston, MA
      - Cambridge, MA
      - Somerville, MA
      - Brookline, MA
      - Newton, MA
      - Watertown, MA
      - Waltham, MA
      - Lexington, MA
      - Burlington, MA
      - Woburn, MA
      - Bedford, MA
      - Billerica, MA
      - Lowell, MA
      - Chelmsford, MA
      - Westford, MA
      - Andover, MA
      - North Andover, MA
      - Tewksbury, MA
      - Wilmington, MA
      - Reading, MA
      - Wakefield, MA
      - Medford, MA
      - Malden, MA
      - Everett, MA
      - Quincy, MA
      - Braintree, MA
      - Dedham, MA
      - Needham, MA
      - Wellesley, MA
      - Natick, MA
      - Framingham, MA
      - Marlborough, MA
      - Hopkinton, MA
      - Southborough, MA
      - Westborough, MA
      - Norwood, MA
      - Canton, MA
      - Danvers, MA
      - Peabody, MA
      - Beverly, MA
      - Salem, MA
      - Haverhill, MA
      - Methuen, MA
      - Lawrence, MA
      - Acton, MA
      - Concord, MA
      - Maynard, MA
      - Littleton, MA
      - Boxborough, MA
      # Southern New Hampshire
      - Nashua, NH
      - Manchester, NH
      - Merrimack, NH
      - Hudson, NH
      - Londonderry, NH
      - Derry, NH
      - Salem, NH
      - Windham, NH
      - Pelham, NH
      - Bedford, NH
      - Amherst, NH
      - Milford, NH
      - Hollis, NH
      - Hooksett, NH
      - Goffstown, NH
      - Concord, NH
      - Portsmouth, NH
      - Dover, NH
      - Durham, NH
      - Exeter, NH
      - Hampton, NH
      - Rochester, NH
  posted_within_days: 7
  skills:
    - LMS
    - leadership development
    - instructional design
    - needs analysis
    - Kirkpatrick
    - onboarding
    - coaching
    - budget
    - people management
    - early career
    - internship
    - university relations
  company_blocklist: []

# Queries run once per title keyword x search location against the keyword-search sources.
search_locations: [Remote]

weights:
  semantic: 35
  title: 20
  salary: 20
  skills: 15
  freshness: 10

penalties:
  skipped_near_duplicate: 10 # points off a role resembling one you skipped at the same company

report:
  top_n: 15
  weekly_digest_day: Monday
  weekly_digest_min_score: 60

scoring:
  # Off: roles are ranked on title, salary, skills and freshness, with semantic fit held neutral.
  # Turn on (and set ANTHROPIC_API_KEY) to have Claude rate each role against the reference job.
  llm: false
  model: claude-haiku-5-5
  concurrency: 5
  max_llm_calls_per_run: 150

sources:
  adzuna: { enabled: true, country: us, results_per_page: 50 }
  greenhouse: { enabled: true }
  lever: { enabled: true }
  ashby: { enabled: true }
  serpapi: { enabled: false, max_queries_per_run: 3 } # free tier is ~100 searches/month
  jsearch: { enabled: false, max_queries_per_run: 5 }
  usajobs: { enabled: false }

email:
  subject_prefix: Raly
