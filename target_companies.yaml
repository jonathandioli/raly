# Companies whose public ATS job boards are read directly (no key needed).
# token = the board slug in the company's careers URL:
#   greenhouse: boards.greenhouse.io/<token>   lever: jobs.lever.co/<token>   ashby: jobs.ashbyhq.com/<token>
#   workday: the full career-site URL, e.g. https://acme.wd5.myworkdayjobs.com/External
# Every entry below answered on 2026-10-24. A company that later moves or renames its
# board shows up in the run footer as an HTTP error; fix or delete it.
# Swap in the companies the candidate actually wants to work for.

